name: Deposco
kind: company
description: Deposco is a cloud supply chain execution platform combining order
  management (OMS) and warehouse management (WMS) for retailers, brands, 3PLs, and
  DTC ecommerce sellers. Its Bright Suite gives real-time visibility into inventory,
  orders, and shipments across the fulfillment lifecycle - receiving, putaway,
  picking, packing, and shipping. Deposco integrates through a REST API exposed on
  its Developer Portal (developer.deposco.com) using resource paths under
  /integration/{code}/, secured with OAuth 2.0 / per-merchant API credentials and
  scoped by tenant code and business unit. API access is provisioned per customer
  through a Deposco account manager rather than through open self-service signup,
  and Deposco also ships 150+ pre-built connectors and EDI integrations.
