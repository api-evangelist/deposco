  - SKU
  - Catalog
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.deposco.com/
  baseURL: https://{instance}.deposco.com/integration/{code}
  properties:
  - url: https://developer.deposco.com/
    type: Documentation
  description: Create and update item (SKU) master data. Modeled from Deposco
    integration references - PUT /items/{itemNumber} for a single item and
    POST /items for bulk item imports. Endpoints are modeled from public integration
    documentation; access is gated per tenant.
- aid: deposco:deposco-inventory-api
  name: Deposco Inventory API
  tags:
  - Inventory
  - Stock
  - Facility
  - Location
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.deposco.com/
  baseURL: https://{instance}.deposco.com/integration/{code}
  properties:
  - url: https://developer.deposco.com/
    type: Documentation
  description: Retrieve real-time inventory by facility and location. Modeled from
    Deposco integration references - GET /inventory/facility/{facilityNumber}/location/{locationNumber}
    and GET /inventory/{businessUnit}/facility/{facilityNumber}/location/{locationNumber}.
    Endpoints are modeled from public integration documentation; access is gated per
    tenant.
- aid: deposco:deposco-shipments-api
  name: Deposco Shipments API
  tags:
  - Shipments
  - Outbound
  - Shipping
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.deposco.com/
  baseURL: https://{instance}.deposco.com/integration/{code}
  properties:
  - url: https://developer.deposco.com/
    type: Documentation
  description: Search outbound shipments produced by fulfillment. Modeled from Deposco
    integration references - GET /search/shipment?orderHeaders.customerOrderNumber={orderNumber}
    to retrieve shipment and tracking detail for a customer order. Endpoints are
    modeled from public integration documentation; access is gated per tenant.
