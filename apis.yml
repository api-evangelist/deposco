apis:
- aid: deposco:deposco-customer-orders-api
  name: Deposco Customer Orders API
  tags:
  - Orders
  - Order Management
  - Fulfillment
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.deposco.com/
  baseURL: https://{instance}.deposco.com/integration/{code}
  properties:
  - url: https://developer.deposco.com/
    type: Documentation
  description: Import and query customer (sales) orders for fulfillment. Modeled from
    Deposco integration references - PUT /import/{businessUnit}/customerOrder/{orderNumber}
    to create or update an order, and GET /search/CoHeader and /search/shipment to
    look up order status and resulting shipments. Endpoints are modeled from public
    integration documentation; exact paths and the tenant base host are provisioned
    per customer.
- aid: deposco:deposco-purchase-orders-api
  name: Deposco Purchase Orders API
  tags:
  - Purchase Orders
  - Procurement
  - Inbound
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.deposco.com/
  baseURL: https://{instance}.deposco.com/integration/{code}
  properties:
  - url: https://developer.deposco.com/
    type: Documentation
  description: Create and search purchase orders for inbound inventory. Modeled from
    Deposco integration references - PUT /orders/Purchase Order/{orderNumber},
    POST /orders, and GET /search/Order?otherReferenceNumber={externalOrderNumber}.
    Endpoints are modeled from public integration documentation; access is gated per
    tenant.
- aid: deposco:deposco-items-api
  name: Deposco Items API
  tags:
  - Items
